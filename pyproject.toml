[project]
name = "deployrisk"
version = "0.1.0"
description = "Deploy risk scoring: a model trained on real commit history plus deterministic gates"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "google-auth>=2.30", "requests>=2.31", "google-genai>=1.0"]

[project.optional-dependencies]
train = ["numpy"]
dev = ["pytest", "numpy", "pytest-asyncio", "pytest-timeout", "ruff"]
openai = ["openai>=1.50"]  # test/eval-only provider; never installed in the deployed image

[project.scripts]
deployrisk = "deployrisk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deployrisk"]

[tool.setuptools.package-data]
deployrisk = ["*.html", "samples/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
testpaths = ["tests"]
markers = [
  "live_vertex: calls Gemini on Vertex AI; opt-in via DEPLOYRISK_LIVE_VERTEX=1",
  "live_openai: calls OpenAI; opt-in via DEPLOYRISK_LIVE_OPENAI=1",
  "live_gcp: reaches a deployed firewall; opt-in via DEPLOYRISK_LIVE_URL=<url>",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
